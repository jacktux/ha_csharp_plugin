name: "My Custom C# Plugin"
version: "1.0.0"
slug: "ha_csharp_plugin"
description: "A high-performance ASP.NET Core API running natively inside Home Assistant."
arch:
  - amd64
  - armv7
  - aarch64
init: false
hassio_api: true  # Grants your C# app access to the SUPERVISOR_TOKEN
ports:
  5000/tcp: 5000  # Exposes your API port to your local network
